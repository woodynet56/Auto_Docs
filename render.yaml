services:
  - type: web
    name: gestoria-reaver-web
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_BASE_URL
        value: https://auto-docs-kv9o.onrender.com
      - key: PUBLIC_WHATSAPP_NUMBER
        value: "525565808766"
      - key: DATABASE_URL
        fromDatabase:
          name: gestoria-reaver-db
          property: connectionString
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_BUSINESS_PHONE_NUMBER
        value: "+525565808766"
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: GESTOR_PHONE_NUMBER
        sync: false
      - key: IDENTIFIER_ENCRYPTION_KEY
        sync: false
      - key: IDENTIFIER_HASH_KEY
        sync: false
      - key: WEBHOOK_MAX_BODY_BYTES
        value: 1048576
      - key: DOCUMENT_MAX_BYTES
        value: 10485760
      - key: DOCUMENT_RETENTION_DAYS
        value: 30
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: PORTAL_SESSION_TTL_MINUTES
        value: 30
      - key: PORTAL_COOKIE_SECURE
        value: true
      - key: PORTAL_OTP_MAX_ATTEMPTS
        value: 5
      - key: PORTAL_OTP_LOCK_MINUTES
        value: 15
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_ADMIN_GROUP
        value: gestoria-admin
      - key: OIDC_OPERATOR_GROUP
        value: gestoria-operator
      - key: OIDC_VIEWER_GROUP
        value: gestoria-viewer
      - key: ADMIN_SESSION_KEY
        sync: false
      - key: ADMIN_SESSION_TTL_MINUTES
        value: 60
      - key: BACKUP_RETENTION_DAYS
        value: 35
      - key: RPO_MINUTES
        value: 60
      - key: RTO_MINUTES
        value: 120
  - type: cron
    name: gestoria-reaver-delivery-retries
    runtime: python
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m scripts.retry_deliveries
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://auto-docs-kv9o.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: gestoria-reaver-db
          property: connectionString
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_BUSINESS_PHONE_NUMBER
        value: "+525565808766"
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: DELIVERY_LINK_TTL_SECONDS
        value: 600
      - key: DELIVERY_MAX_ATTEMPTS
        value: 3
      - key: PORTAL_SESSION_TTL_MINUTES
        value: 30
  - type: cron
    name: gestoria-reaver-quarantine-scanner
    runtime: python
    plan: starter
    region: oregon
    schedule: "*/2 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m scripts.scan_quarantine
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gestoria-reaver-db
          property: connectionString
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: 3310
      - key: MALWARE_SCAN_MAX_ATTEMPTS
        value: 3
      - key: DOCUMENT_MAX_BYTES
        value: 10485760
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: gestoria-reaver-db
    plan: basic-256mb
    region: oregon
    databaseName: gestoria_reaver
    user: gestoria_reaver
