[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gestoria-reaver"
version = "0.12.0"
description = "Plataforma segura de gestión documental digital"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.4",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.14.2",
  "psycopg[binary]==3.3.4",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]==1.9.4",
  "mypy==1.20.2",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.3.0",
  "ruff==0.16.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "pip-build-env-*", "tmp*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires an external PostgreSQL database",
  "e2e: requires the isolated preproduction stack",
  "resilience: requires controlled dependency fault injection",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/db/models/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
